<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#0F1A1B" media="(prefers-color-scheme: dark)">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell, one column (max 760px), sticky top bar, bottom tab bar, slide-through rails, full-screen reading overlays */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --line:#D5DCD3;
  --ink:#1D2A28; --ink-2:#4D5C59; --ink-3:#7C8A86;
  --river:#2E6C67; --river-ink:#FFFFFF; --river-soft:#D9E9E5;
  --gold:#A87A23; --gold-soft:#F3E7CC;
  --rose:#A9475F; --rose-soft:#F5DFE4;
  --slate:#3C5C87; --slate-soft:#DCE5F1;
  --plum:#7A4A8C; --plum-soft:#EFE3F4;
  --sage:#4F7A4A; --sage-soft:#E2EEDF;
  --coral:#B65A3C; --coral-soft:#F8E2D8;
  --sky:#2F6E9E; --sky-soft:#DCEBF6;
  --on-jewel:#FFFFFF;
  --shadow:0 1px 2px rgba(29,42,40,.06),0 6px 24px rgba(29,42,40,.07);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1819; --surface:#142325; --surface-2:#1B2E31; --line:#28403F;
  --ink:#E7EEEA; --ink-2:#B3C2BE; --ink-3:#83958F;
  --river:#7EC2B6; --river-ink:#0D1819; --river-soft:#1C3A39;
  --gold:#E2B85E; --gold-soft:#3A3120;
  --rose:#E79AAB; --rose-soft:#3C2630;
  --slate:#9DBBE3; --slate-soft:#22324A;
  --plum:#C9A3DA; --plum-soft:#31243A;
  --sage:#A6CF9E; --sage-soft:#22331F;
  --coral:#F0A487; --coral-soft:#3D2820;
  --sky:#8EC3EA; --sky-soft:#1C3142;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1819; --surface:#142325; --surface-2:#1B2E31; --line:#28403F;
  --ink:#E7EEEA; --ink-2:#B3C2BE; --ink-3:#83958F;
  --river:#7EC2B6; --river-ink:#0D1819; --river-soft:#1C3A39;
  --gold:#E2B85E; --gold-soft:#3A3120;
  --rose:#E79AAB; --rose-soft:#3C2630;
  --slate:#9DBBE3; --slate-soft:#22324A;
  --plum:#C9A3DA; --plum-soft:#31243A;
  --sage:#A6CF9E; --sage-soft:#22331F;
  --coral:#F0A487; --coral-soft:#3D2820;
  --sky:#8EC3EA; --sky-soft:#1C3142;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);
  color-scheme:dark}
/* tone classes: themed accent + fixed jewel gradient (white text in both themes) */
.t-plum{--accent:var(--plum);--accent-soft:var(--plum-soft);--j1:#4E2F63;--j2:#8A5A9E}
.t-sage{--accent:var(--sage);--accent-soft:var(--sage-soft);--j1:#2F5530;--j2:#5F8A55}
.t-coral{--accent:var(--coral);--accent-soft:var(--coral-soft);--j1:#8A3A22;--j2:#C9693F}
.t-sky{--accent:var(--sky);--accent-soft:var(--sky-soft);--j1:#1D4E78;--j2:#3F7FB3}
.t-gold{--accent:var(--gold);--accent-soft:var(--gold-soft);--j1:#74520F;--j2:#B98A2A}
.t-rose{--accent:var(--rose);--accent-soft:var(--rose-soft);--j1:#7A2B40;--j2:#B4566A}
.t-navy{--accent:var(--slate);--accent-soft:var(--slate-soft);--j1:#22385C;--j2:#3E6497}
.t-teal{--accent:var(--river);--accent-soft:var(--river-soft);--j1:#174F4B;--j2:#2F8A7F}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--river);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--river);color:var(--river-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn.acc{background:var(--accent,var(--river));color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--river);font-weight:600}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--river);border-color:var(--river);color:var(--river-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
textarea,input[type=text],input[type=search]{width:100%;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;resize:vertical}
select{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-size:15px}
textarea:focus,input[type=text]:focus,input[type=search]:focus{outline:none;border-color:var(--river)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* boot */
.boot{min-height:100%;display:grid;place-items:center;text-align:center;padding:40px 16px}
.boot h1{font-size:64px;letter-spacing:.02em}
.ripple{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;position:relative}
.ripple::before,.ripple::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent,var(--river));animation:rip 3.2s ease-out infinite}
.ripple::after{animation-delay:1.6s}
@keyframes rip{from{transform:scale(.35);opacity:.9}to{transform:scale(1.25);opacity:0}}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;padding-block:20px 28px}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.ob-bar{flex:1;height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.ob-bar i{display:block;height:100%;background:var(--river);transition:width .4s}
.ob h2{font-size:34px;margin-bottom:10px}
.ob .lead{color:var(--ink-2);margin-bottom:22px;max-width:52ch}
.ob-foot{margin-top:auto;padding-top:28px;display:flex;gap:10px}
.ob-foot .btn{flex:1}
.choice{display:flex;flex-direction:column;gap:10px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;text-align:left}
.choice button[aria-pressed="true"]{border-color:var(--river);box-shadow:inset 0 0 0 1.5px var(--river)}
.choice b{font-weight:600}
.choice span{color:var(--ink-2);font-size:14px}
.word{font-family:var(--display);font-size:72px;line-height:1;margin:12px 0 4px}
.def{font-style:italic;font-family:var(--display);font-size:22px;color:var(--ink-2)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.brand{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.02em}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--river-soft);color:var(--river);font-weight:700}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--river)}
.tab{padding-block:6px 20px;display:flex;flex-direction:column;gap:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-size:27px}

/* rails (slide-through rows) */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.rdots{display:flex;gap:6px;justify-content:center}
.rdots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:all .25s}
.rdots i.on{width:18px;background:var(--ink-2)}

/* jewel cards */
.jewel{position:relative;overflow:hidden;border:0;border-radius:22px;color:var(--on-jewel);background:linear-gradient(140deg,var(--j1),var(--j2));text-align:left;display:flex;flex-direction:column;gap:6px;padding:20px}
.jewel .motif{position:absolute;right:-14px;bottom:-14px;width:170px;height:170px;opacity:.22;color:var(--on-jewel);pointer-events:none}
.jewel .k{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
.jewel h3{font-size:31px;position:relative;color:var(--on-jewel)}
.jewel p{position:relative;font-size:14.5px;opacity:.92;max-width:34ch}
.jewel .go{position:relative;margin-top:auto;align-self:flex-start;background:rgba(255,255,255,.95);color:#1d2a28;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.slide{width:min(86%,520px);min-height:220px}
.mini{width:min(64%,250px);min-height:170px;padding:16px}
.mini h3{font-size:24px}
.mini .motif{width:120px;height:120px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:18px;padding:16px;background:var(--accent-soft);color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;font-weight:700;font-size:16px;min-width:0}
.tile svg{width:30px;height:30px;color:var(--accent);flex:none}
.tile small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-2)}

/* today */
.hello h1{font-size:36px}
.hello p{color:var(--ink-2)}
.votd{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 20px 20px;background:var(--surface);box-shadow:var(--shadow)}
.votd blockquote{margin:10px 0 10px;font-family:var(--display);font-size:24px;line-height:1.3;font-weight:500}
.votd cite{font-style:normal;font-weight:600;font-size:14px;color:var(--river)}
.votd .actions{display:flex;gap:16px;margin-top:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:24px;height:6px;border-radius:6px;background:rgba(255,255,255,.3)}
.dots i.on{background:rgba(255,255,255,.95)}
.dots i.now{background:rgba(255,255,255,.6)}
.rhythm{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rhythm .num{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-3)}
.week span{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.week span.on{background:var(--gold);color:var(--surface)}
.week span.today{box-shadow:inset 0 0 0 2px var(--gold)}
.readcard{display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%}
.readcard .ic{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.readcard .ic svg{width:26px;height:26px}
.readcard div{min-width:0;flex:1}
.bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent,var(--river))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font-weight:600;font-size:15px;min-width:0}
.quick .wide{grid-column:1/-1}
.quick button small{font-weight:400;color:var(--ink-3);font-size:12.5px}
.quick svg{width:22px;height:22px;color:var(--river)}
.pour-h{font-size:40px;line-height:1.05}
.pour-verse{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.5;color:var(--ink-2,var(--ink))}
.pour-verse cite{display:block;font-style:normal;font-family:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px;color:var(--ink-3)}
.pour-mic{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.pour-orb{position:relative;width:118px;height:118px;border-radius:50%;border:0;background:var(--accent,var(--river));color:#fff;display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.18);transition:transform .2s}
.pour-orb svg{width:46px;height:46px}
.pour-orb:active{transform:scale(.96)}
.pour-orb::before,.pour-orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent,var(--river));opacity:0}
.pour-orb.on::before{animation:pourRing 2.2s ease-out infinite}
.pour-orb.on::after{animation:pourRing 2.2s ease-out 1.1s infinite}
@keyframes pourRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.pour-heard{font-size:18px;line-height:1.6}
.pour-lab{font-weight:600;color:var(--ink-2,var(--ink))}
.pour-note{background:var(--surface);border-radius:16px;padding:14px 16px;line-height:1.55;box-shadow:var(--shadow)}
#pourText{min-height:170px;font-size:17px;line-height:1.55}
.pour-prayer{font-family:var(--display);font-style:italic;font-size:20px;line-height:1.6}
.pour-rise{padding:50px 6px 20px;text-align:center;font-family:var(--display);font-size:20px;line-height:1.8;min-height:240px}
.pour-rise span{display:inline-block;animation:pourUp 1.6s ease-in forwards}
@keyframes pourUp{0%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-90px) scale(.9);filter:blur(3px)}}
.pour-cta{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#5B3A7A,#9A5C8E 60%,#D08A7A);box-shadow:var(--shadow)}
.pour-cta b{display:block;font-size:17px}
.pour-cta small{display:block;opacity:.9;font-size:13.5px;margin-top:3px;line-height:1.4}
.pour-cta-ic{flex:0 0 52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.pour-cta-ic svg{width:26px;height:26px}
@media (prefers-reduced-motion:reduce){.pour-orb.on::before,.pour-orb.on::after{animation:none;opacity:.5}.pour-rise span{animation-duration:.01s}}


/* explore lists */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.jcard{border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.jcard::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent)}
.jcard h3{font-size:25px}
.jcard p{font-size:14px;color:var(--ink-2)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.jmeta{font-size:13px;color:var(--ink-3);margin-top:auto;padding-top:6px}
.subh{font-family:var(--display);font-size:22px;font-weight:600;margin-top:4px}
.w{--accent:var(--rose);--accent-soft:var(--rose-soft);--j1:#7A2B40;--j2:#B4566A}
.m{--accent:var(--slate);--accent-soft:var(--slate-soft);--j1:#22385C;--j2:#3E6497}
.a{--accent:var(--gold);--accent-soft:var(--gold-soft);--j1:#74520F;--j2:#B98A2A}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-top{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.ov-top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.ov-body{padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.sheet-body{padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

/* session */
.sess-hero{min-height:0}
.sess-hero h1{font-size:40px;position:relative;color:var(--on-jewel)}
.step{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.step h2{font-size:28px}
.prose{font-size:17.5px;line-height:1.7;max-width:62ch}
.prose p+p{margin-top:14px}
.passage{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.passage h3{font-size:22px;margin-bottom:10px}
.verses{font-family:var(--display);font-size:21px;line-height:1.6}
.verses sup{font-family:var(--body);font-size:11px;font-weight:700;color:var(--accent,var(--river));margin-right:3px;vertical-align:super}
.prayer{font-family:var(--display);font-size:22px;line-height:1.55;font-style:italic;max-width:56ch}
.action{border-radius:var(--r);padding:18px;background:var(--gold-soft);display:flex;flex-direction:column;gap:6px}
.action b{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pager{display:flex;gap:10px;margin-top:26px}
.pager .btn{flex:1}
.progress-line{height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden;flex:1}
.progress-line i{display:block;height:100%;background:var(--accent,var(--river));transition:width .35s}

function bookIndex(name){const n=name.trim().toLowerCase().replace(/\s+/g," ").replace(/^(i{1,3})\s/,(m,r)=>r.length+" ").replace(/\.$/,"");const i=BOOKS.findIndex(b=>b.toLowerCase()===n);if(i>=0)return i;return BOOK_ALIAS[n]??-1}
function parseRef(s){
  const m=String(s).trim().match(/^((?:[123]\s*)?[A-Za-z][A-Za-z .]*?)\s+(\d+)(?::(\d+)(?:\s*[-–]\s*(\d+))?)?$/);
  if(!m)return null;const b=bookIndex(m[1]);if(b<0)return null;
  return {b,c:+m[2],v1:m[3]?+m[3]:null,v2:m[4]?+m[4]:(m[3]?+m[3]:null)}
}
function refLabel(r){return BOOKS[r.b]+" "+r.c+(r.v1?":"+r.v1+(r.v2&&r.v2!==r.v1?"–"+r.v2:""):"")}
const TRANS={kjv:{name:"King James Version",short:"KJV"},bbe:{name:"Bible in Basic English",short:"BBE"},lut:{name:"Luther 1912 (Deutsch)",short:"Deutsch"}};
const BIBLE={};
function loadBible(tr){if(!BIBLE[tr])BIBLE[tr]=fetch("bible/"+tr+".json").then(r=>{if(!r.ok)throw new Error("Bible text did not load");return r.json()}).catch(e=>{delete BIBLE[tr];throw e});return BIBLE[tr]}
async function passage(ref,tr){
  const r=typeof ref==="string"?parseRef(ref):ref;if(!r)return null;
  const bib=await loadBible(tr);const ch=bib[r.b]&&bib[r.b][r.c-1];if(!ch)return null;
  const a=r.v1||1,z=Math.min(r.v2||ch.length,ch.length);if(a>ch.length)return null;
  const verses=[];for(let v=a;v<=z;v++)verses.push({n:v,t:ch[v-1]});
  return {label:refLabel(r),verses,r}
}

}

const queues={};
function docRef(name){return S.db.doc("data/users/"+S.uid+"/"+name)}
async function load(name){
  if(S.db&&S.uid){try{const s=await docRef(name).get();return s.exists?clone(s.data()):null}catch(e){console.warn(e);return null}}
  return lsGet(name)
}
function save(name,data){
  const body=clone(data);
  if(!(S.db&&S.uid)){lsSet(name,body);return Promise.resolve()}
  queues[name]=(queues[name]||Promise.resolve()).then(()=>docRef(name).set(body)).catch(e=>{console.warn(e);if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete some old prayers or chats.");else if(e&&e.code==="invalid_argument")toast("That didn't save. Check your connection.")});
  return queues[name]
}

function rhythm(days){
  const set=new Set(days);let n=0,miss=0;const d=new Date();
  for(let i=0;i<400;i++){const k=dayStr(d);if(set.has(k)){n++;miss=0}else if(i>0){miss++;if(miss>1)break}d.setDate(d.getDate()-1)}
  return n
}

async function boot(){
  let db=null,user=null,sample=null,dl=null;
  if(window.claude&&typeof window.claude.use==="function"){
    [db,user,sample,dl]=await Promise.all(["db","user","sample","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  }
  S.db=db;S.user=user;S.sample=sample;S.dl=dl;
  if(user){try{S.uid=await user.id()}catch(e){}try{S.isOwner=await user.isOwner()}catch(e){}}
  if(!S.uid)S.db=null;
  const [profile,progress,journal,chat,marks]=await Promise.all([load("profile"),load("progress"),load("journal"),load("chat"),load("marks")]);
  S.marks=marks||{hl:{},saved:[],mem:[]};
  S.profile=profile;S.progress=progress||{journeys:{},days:[],active:null};S.progress.plans=S.progress.plans||{};S.progress.journeys=S.progress.journeys||{};
  S.journal=journal||{items:[]};S.chat=(chat&&chat.turns)||[];
  $("#boot").hidden=true;
  if(!S.profile||!S.profile.onboarded)startOnboarding();else enterApp();
}

function recommend(kind){
  const p=S.profile||OB.d,want=p.walk==="men"?"m":"w";
  const pool=ITEMS.filter(x=>x.kind===kind);
  const scored=pool.map(j=>{let s=0;(p.struggles||[]).forEach(t=>{if((j.tags||[]).includes(t))s+=2});
    if(kind==="journey"){if(j.who===want)s+=3;if(j.who!=="a"&&j.who!==want)s-=4;if(j.id==="start-here")s+=(p.stage==="want"||p.stage==="exploring")?20:-6}
    if(j.id==="abroad"&&/abroad|germany|deutsch|ausbildung|visa|relocat|japa|canada|europe|uk\b|travel/i.test(((p.goals||[]).map(g=>g.text).join(" "))+" "+(p.story||"")))s+=12;

}

  });

  const mood=todayMood();CARD.style=mood?(CARD_STYLES[mood.tone]?mood.tone:"teal"):(["night","dusk"].includes(skyPeriod())?"night":"teal");
  openSheet(`<div class="cardwrap"><canvas id="cardcv" width="1080" height="1350" aria-label="Verse card preview"></canvas></div>
   <div class="stack" style="gap:8px"><b>Colour</b><div class="swatches">${Object.entries(CARD_STYLES).map(([k,v])=>`<button aria-label="${k}" aria-pressed="${CARD.style===k}" data-act="cstyle:${k}" style="background:linear-gradient(140deg,${v.join(",")})"></button>`).join("")}</div></div>

   <button class="btn block" data-act="csave">Save image</button><div id="cardout"></div>`,"Verse card");

function wrapLines(ctx,text,maxW){const words=text.split(/\s+/);const lines=[];let cur="";for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function drawCard(){
  const cv=$("#cardcv");if(!cv)return;const W=1080,H=CARD.size==="story"?1920:1350;cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  const cols=CARD_STYLES[CARD.style]||CARD_STYLES.teal;
  const g=ctx.createLinearGradient(0,0,W*.4,H);cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1),c));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(W*.82,H*.16,10,W*.82,H*.16,W*.7);glow.addColorStop(0,"rgba(255,255,255,.22)");glow.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  if(CARD.style==="night"){for(let i=0;i<70;i++){ctx.fillStyle=`rgba(255,255,255,${.25+((i*13)%7)/10})`;ctx.beginPath();ctx.arc((i*97.31)%W,(i*53.77*7)%(H*.55),(i%3)*.9+1.1,0,Math.PI*2);ctx.fill()}}
  ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=3;for(let k=0;k<3;k++){ctx.beginPath();const y=H*.86+k*34;ctx.moveTo(0,y);for(let x=0;x<=W;x+=60)ctx.quadraticCurveTo(x+15,y+(x/60%2?-14:14),x+30,y);ctx.stroke()}
  try{await Promise.all([document.fonts.load('italic 600 64px "Cormorant Garamond"'),document.fonts.load('700 30px "Figtree"'),document.fonts.load('600 54px "Cormorant Garamond"')])}catch(e){}
  if(!$("#cardcv"))return;
  const maxW=W*.78,maxH=H*(CARD.size==="story"?.5:.56);let fs=86,lines=[],lh=0;
  for(;fs>=34;fs-=4){ctx.font=`italic 600 ${fs}px "Cormorant Garamond", Georgia, serif`;lines=wrapLines(ctx,CARD.text,maxW);lh=fs*1.3;if(lines.length*lh<=maxH)break}
  const total=lines.length*lh;let y=(H-total)/2-20;
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.font=`600 220px "Cormorant Garamond", Georgia, serif`;ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText("“",W/2,y-10);
  ctx.fillStyle="#fff";ctx.font=`italic 600 ${fs}px "Cormorant Garamond", Georgia, serif`;ctx.textBaseline="top";
  lines.forEach((l,i)=>ctx.fillText(l,W/2,y+i*lh));
  y+=total+44;ctx.font=`700 32px "Figtree", system-ui, sans-serif`;try{ctx.letterSpacing="4px"}catch(e){}
  ctx.fillStyle="rgba(255,255,255,.88)";ctx.fillText(CARD.ref.toUpperCase(),W/2,y);try{ctx.letterSpacing="0px"}catch(e){}
  ctx.font=`600 54px "Cormorant Garamond", Georgia, serif`;ctx.fillStyle="rgba(255,255,255,.85)";ctx.textBaseline="alphabetic";ctx.fillText("Selah",W/2,H-(CARD.size==="story"?150:90))
}
function saveCard(){
  const cv=$("#cardcv");if(!cv)return;const out=$("#cardout");
  const fallback=()=>{out.innerHTML=`<p class="small muted" style="text-align:center;margin-bottom:10px">Press and hold the image, then choose Save to Photos.</p><img alt="Verse card" src="${cv.toDataURL("image/png")}">`};

    if(!blob){fallback();return}
    if(S.dl){try{await S.dl.save({filename:"selah-"+CARD.ref.split(" · ")[0].replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()+".png",data:blob});toast("Card saved");return}catch(e){if(e&&e.code==="declined")return}}
    fallback()

function careCheck(t){return /\b(suicid|kill myself|end my life|want to die|self[- ]?harm|cut myself|hurt myself|no reason to live)/i.test(t||"")}
function careCard(){return `<div class="care"><b>You matter, and you don't have to carry this alone.</b><p>If you're thinking about hurting yourself, please talk to someone you trust right now. If you're in danger, call <b>112</b> (Nigeria emergency) or your local emergency number.</p></div>`}
function refChip(label){const r=parseRef(label);if(!r)return h(label);return `<button class="refchip" data-act="ref" data-ref="${h(refLabel(r))}">${h(refLabel(r))}</button>`}
function renderAI(text){
  return h(text).replace(/\[\[([^\]]{3,40})\]\]/g,(m,ref)=>{const r=parseRef(ref.replace(/&amp;/g,"&"));return r?`<button class="refchip" data-act="ref" data-ref="${h(refLabel(r))}">${h(refLabel(r))}</button>`:ref})
}

   ${S.sample?"":`<div class="empty">Ask isn't available right now. Check your internet connection and try again.</div>`}
   <div class="chat" id="chat">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${m.role==="user"?h(m.content):renderAI(m.content)}</div>`).join(""):
     `<p class="muted">Bring any question or anything you're going through. Answers come from Scripture, with references you can tap to read.</p><div class="chips">${starters.map(s=>`<button class="chip" data-act="starter" data-v="${h(s)}">${s}</button>`).join("")}</div>`}</div>
   <div class="composer"><textarea id="askbox" rows="1" maxlength="2000" placeholder="Ask a question…">${h(prefill||"")}</textarea><button class="iconbtn" style="background:var(--river);color:var(--river-ink);width:48px;height:48px" data-act="send" aria-label="Send">${ICON.send}</button></div>`;
  if(prefill)$("#askbox").focus();
}
async function sendAsk(text){
  text=(text||"").trim();if(!text||!S.sample)return;if(S.asking)return;S.asking=true;
  const p=S.profile;const struggles=(p.struggles||[]).map(k=>(STRUGGLES.find(s=>s[0]===k)||[k,k])[1]).join(", ");
  S.chat.push({role:"user",content:text});renderAsk();
  const chat=$("#chat");const bubble=document.createElement("div");bubble.className="msg ai";bubble.textContent="Thinking…";chat.appendChild(bubble);
  if(careCheck(text))bubble.insertAdjacentHTML("beforebegin",careCard());
  bubble.scrollIntoView({block:"end"});
  const RULES=`You are the Bible companion inside "Selah", a devotional app. You're talking with ${p.name} (age ${p.age||"not given"}; carrying: ${struggles||"not shared"}; wants God to: ${(p.desires||[]).join(", ")||"not shared"}; believing God for: ${goalsText()||"not shared"}).
Rules:
- Ground answers in Scripture. Cite references in double square brackets with standard English book names, like [[Philippians 4:6-7]] or [[Esther 4:14]]. The app shows the real verse text, so don't quote long passages yourself and never invent a verse.
- When it helps, point to people in the Bible who faced something similar ("During the time of Ruth..."), weaving two or three together when it fits${p.walk==="women"?", favouring women of the Bible when it fits naturally":p.walk==="men"?", favouring men of the Bible when it fits naturally":""}.
- Speak as a caring, wise friend who knows the Bible, never as God. Be warm, honest and practical. 120-220 words unless asked for more. Short paragraphs, no headings, no bullet lists unless asked.
- Where Christian traditions genuinely differ, say so briefly and kindly.
- If they mention self-harm, suicide, abuse or danger: respond with care first, encourage them to contact someone they trust right now and emergency services (112 in Nigeria), and keep it gentle.
- Encourage real community (a church or believing friends) when it fits, without lecturing.
Reply to the conversation that follows.`;
  const turns=S.chat.slice(-12);
  try{
    const {text:ans}=await S.sample([{role:"user",content:RULES},{role:"assistant",content:"Understood. I'm ready."},...turns],{cache:false,modelTier:"default",onText:({text})=>{bubble.innerHTML=renderAI(text)}});
    bubble.innerHTML=renderAI(ans);S.chat.push({role:"assistant",content:ans});
    if(S.chat.length>40)S.chat=S.chat.slice(-40);save("chat",{turns:S.chat});
  }catch(e){bubble.textContent=e&&e.code==="not_granted"?"Please sign in again to use Ask.":e&&e.code==="rate_limited"?(e.daily?"You've reached today's Ask limit. It resets tomorrow.":"The AI is busy right now. Try again in a minute."):"That didn't send. Try again.";S.chat.pop()}
  S.asking=false

const Speech={on:false,btn:null,
  ok(){return "speechSynthesis" in window},
  voice(){return Guide.voice()},
  speak(text,btn){
    if(!this.ok()){toast("Read-aloud isn't supported in this browser");return}
    if(this.on){this.stop();return}
    this.on=true;this.btn=btn;if(btn)btn.innerHTML=ICON.stop+" Stop";
    const parts=String(text).match(/[^.!?;:]+[.!?;:]*\s*/g)||[text];const chunks=[];let cur="";
    for(const p of parts){if((cur+p).length>220){if(cur)chunks.push(cur);cur=p}else cur+=p}if(cur)chunks.push(cur);
    Ambient.duck(true);const v=this.voice();
    chunks.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c.trim());if(v)u.voice=v;u.rate=.92;u.pitch=1;if(i===chunks.length-1)u.onend=()=>this.stop();u.onerror=()=>{if(i===chunks.length-1)this.stop()};speechSynthesis.speak(u)})
  },
  stop(){try{if(this.ok())speechSynthesis.cancel()}catch(e){}this.on=false;Ambient.duck(false);if(this.btn&&this.btn.isConnected)this.btn.innerHTML=ICON.play+" Listen";this.btn=null}
};

/* ---------------- Ambient: river + soft piano, synthesized live ---------------- */
/* Seven soundscapes, all generated live in the browser (no recordings, nothing licensed). */
const SCAPE_CFG={
 river:{noise:"river",piano:{oct:0,dens:1},pad:null,extra:null},
 rain:{noise:"rain",piano:{oct:-12,dens:.8},pad:null,extra:"drops"},
 strings:{noise:null,piano:null,pad:"strings",extra:null},
 birds:{noise:"breeze",piano:{oct:12,dens:1},pad:null,extra:"birds"},
 night:{noise:"night",piano:null,pad:"low",extra:"crickets"},
 chimes:{noise:null,piano:null,pad:"soft",extra:"chimes"},
 piano:{noise:null,piano:{oct:0,dens:1.2},pad:null,extra:null}
};
const Ambient={ctx:null,on:false,master:null,timer:null,next:0,ci:0,scape:"river",
  pick(){const m=todayMood&&S.progress?todayMood():null;return S.scape||(m&&m.scape)||(S.profile&&S.profile.scape)||"river"},
  autoStart(){if(!this.on&&!S.musicMuted&&S.profile&&S.profile.music!==false)this.start(this.pick())},
  play(id){S.scape=id;S.musicMuted=false;if(S.profile){S.profile.scape=id}if(this.on){this.stop(true)}this.start(id)},
  noiseBuf(ctx,secs,brown){const b=ctx.createBuffer(1,ctx.sampleRate*secs,ctx.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.2}else d[i]=w}return b},
  loopNoise(buf,filters,gain,lfoRate,lfoDepth,lfoTarget){const ctx=this.ctx;const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;let node=s;
    filters.forEach(([type,f,q])=>{const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;node.connect(fl);node=fl;if(lfoTarget==="f"&&!this._lf){this._lf=fl}});
    const g=ctx.createGain();g.gain.value=gain;node.connect(g);g.connect(this.master);
    if(lfoRate){const l=ctx.createOscillator();l.frequency.value=lfoRate;const lg=ctx.createGain();lg.gain.value=lfoDepth;l.connect(lg);lg.connect(lfoTarget==="f"&&this._lf?this._lf.frequency:g.gain);l.start()}
    s.start();this._lf=null},
  start(id){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast("Music isn't supported in this browser");return}
      id=SCAPE_CFG[id]?id:"river";this.scape=id;this.scope=whereNow();const cfg=this.cfg=SCAPE_CFG[id];
      const ctx=this.ctx=new AC();ctx.resume&&ctx.resume();
      const master=this.master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
      master.gain.linearRampToValueAtTime(this.ducked?.3:.9,ctx.currentTime+3);
      const len=ctx.sampleRate*3.5,ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
      const verb=this.verb=ctx.createConvolver();verb.buffer=ir;const wet=ctx.createGain();wet.gain.value=.55;verb.connect(wet);wet.connect(master);
      const brown=this.noiseBuf(ctx,6,true),white=this.noiseBuf(ctx,4,false);this.white=white;
      if(cfg.noise==="river"){this.loopNoise(brown,[["lowpass",700]],.42,.07,260,"f");this.loopNoise(white,[["bandpass",2600,.8]],.018,.21,.012)}
      if(cfg.noise==="rain"){this.loopNoise(white,[["highpass",1400],["lowpass",7000]],.05,.11,.012);this.loopNoise(brown,[["lowpass",380]],.28,.05,.05)}
      if(cfg.noise==="breeze"){this.loopNoise(brown,[["bandpass",520,.5]],.16,.06,.09)}
      if(cfg.noise==="night"){this.loopNoise(brown,[["lowpass",260]],.22,.04,.05)}
      this.next=ctx.currentTime+1.2;this.ci=0;this.timer=setInterval(()=>this.sched(),250);
      this.on=true;this.ui()
    }catch(e){console.warn(e);toast("Music couldn't start")}
  },
  out(node,wet){node.connect(this.master);if(wet)node.connect(this.verb)},
  note(f,t,v){const ctx=this.ctx;const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0004,t+4.5);
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;g.connect(lp);this.out(lp,true);
    [[1,1],[2,.38],[3,.14],[4,.06]].forEach(([m,a])=>{const o=ctx.createOscillator();o.type="sine";o.frequency.value=f*m;o.detune.value=(Math.random()-.5)*6;const og=ctx.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+4.8)})},
  padChord(notes,t,dur,kind){const ctx=this.ctx;const hz=n=>440*Math.pow(2,(n-69)/12);
    const type=kind==="strings"?"sawtooth":kind==="low"?"sine":"triangle",cut=kind==="strings"?950:kind==="low"?500:1600,vol=kind==="strings"?.022:kind==="low"?.05:.03,shift=kind==="low"?-12:0;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=cut;this.out(lp,true);
    notes.forEach(n=>[-7,7].forEach(dt=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=hz(n+shift);o.detune.value=dt;const g=ctx.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+2.6);g.gain.setValueAtTime(vol,t+dur-.4);g.gain.linearRampToValueAtTime(0,t+dur+2.6);o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+2.8)}))},
  drop(t){const ctx=this.ctx;const s=ctx.createBufferSource();s.buffer=this.white;const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1800+Math.random()*3200;bp.Q.value=6;const g=ctx.createGain();g.gain.setValueAtTime(.05*Math.random()+.015,t);g.gain.exponentialRampToValueAtTime(.0005,t+.07);s.connect(bp);bp.connect(g);this.out(g,false);s.start(t,Math.random()*3,.09)},
  chirp(t){const ctx=this.ctx;const n=2+Math.floor(Math.random()*3),base=2600+Math.random()*1400;for(let i=0;i<n;i++){const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*.16;o.type="sine";o.frequency.setValueAtTime(base,s);o.frequency.exponentialRampToValueAtTime(base*1.5,s+.09);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.022,s+.015);g.gain.exponentialRampToValueAtTime(.0005,s+.12);o.connect(g);this.out(g,true);o.start(s);o.stop(s+.14)}},
  cricket(t){const ctx=this.ctx;for(let i=0;i<5;i++){const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*.055;o.type="sine";o.frequency.value=4700;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.009,s+.008);g.gain.linearRampToValueAtTime(0,s+.03);o.connect(g);this.out(g,false);o.start(s);o.stop(s+.04)}},
  bell(f,t){const ctx=this.ctx;[[1,1],[2.76,.4],[5.4,.18]].forEach(([m,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035*a,t+.01);g.gain.exponentialRampToValueAtTime(.0004,t+5);o.connect(g);this.out(g,true);o.start(t);o.stop(t+5.2)})},
  sched(){
    if(!this.ctx)return;const ctx=this.ctx,cfg=this.cfg;const hz=n=>440*Math.pow(2,(n-69)/12);
    const chords=[[50,62,66,69,73,76],[47,59,62,66,69,74],[43,55,59,62,66,71],[45,57,61,64,69,71]];
    while(this.next<ctx.currentTime+1.2){
      const ch=chords[this.ci%chords.length],t=this.next;
      if(cfg.piano){const o=cfg.piano.oct;this.note(hz(ch[0]+Math.min(o,0)),t,.15);
        const k=Math.round(3*cfg.piano.dens);const picks=ch.slice(1).sort(()=>Math.random()-.5).slice(0,k);
        picks.forEach((n,i)=>this.note(hz(n+o),t+.9+i*(.9+Math.random()*.7),.07+Math.random()*.03));
        if(Math.random()<.4)this.note(hz(ch[ch.length-1]+12+Math.max(o,0)),t+4.6,.04)}
      if(cfg.pad)this.padChord(ch.slice(0,4),t,7.2,cfg.pad);
      if(cfg.extra==="crickets")for(let k=0;k<4;k++)this.cricket(t+1+k*1.6+Math.random()*.6);
      if(cfg.extra==="chimes")for(let k=0;k<3;k++)this.bell(hz([74,76,78,81,83,86][Math.floor(Math.random()*6)]),t+.6+k*(1.8+Math.random()*1.4));
      this.next+=7.2;this.ci++
    }
    if(cfg.extra==="drops")for(let k=0;k<4;k++)if(Math.random()<.6)this.drop(ctx.currentTime+Math.random()*.25);
    if(cfg.extra==="birds"&&Math.random()<.05)this.chirp(ctx.currentTime+.1);
  },
  leave(sc){if(this.on&&this.scope===sc)this.stop()},
  duck(on){this.ducked=on;if(this.master&&this.ctx)this.master.gain.setTargetAtTime(on?.3:.9,this.ctx.currentTime,.4)},
  stop(switching){if(!this.ctx)return;const ctx=this.ctx;clearInterval(this.timer);this.master.gain.setTargetAtTime(0,ctx.currentTime,switching?.3:.5);setTimeout(()=>{try{ctx.close()}catch(e){}},2200);this.ctx=null;this.on=false;this.ui()},
  ui(){const f=$("#soundFab");f.setAttribute("aria-pressed",String(this.on));f.querySelector("span").textContent=this.on?SCAPES[this.scape].name:"Calm music";if(!$("#musicPanel").hidden)renderMusicPanel()}
};

    case "speak-plan":Speech.speak(SESS.planText||"",b);break;
    case "speak-last-prayer":S.lastPrayer&&Speech.speak(S.lastPrayer.text,b);break;
    case "speak-chapter":{const bib=await loadBible(S.bible.tr);Speech.speak(BOOKS[S.bible.b]+" chapter "+S.bible.c+". "+bib[S.bible.b][S.bible.c-1].join(" "),b);break}
    case "votd-listen":if(S.votd)Speech.speak(S.votd.label+". "+S.votd.verses.map(v=>v.t).join(" "),null);break;
    case "votd-ask":if(S.votd){showTab("ask");renderAsk(`Today's verse is ${S.votd.label}. What does it mean for me right now?`)}break;
    case "ask-chapter":showTab("ask");renderAsk(`Help me understand ${BOOKS[S.bible.b]} ${S.bible.c}. What's happening and what does it mean for my life?`);break;
    case "tr":S.bible.tr=x;Speech.stop();renderBible();break;
    case "books":S.bible.b=null;S.bible.c=null;try{localStorage.removeItem("selah:bibleLast")}catch(e){}renderBible();break;
    case "book":S.bible.b=+x;S.bible.c=null;renderBible();window.scrollTo(0,0);break;
    case "chapters":S.bible.c=null;Speech.stop();renderBible();break;
    case "ch":Ambient.autoStart();S.bible.c=+x;renderBible();window.scrollTo(0,0);break;
    case "chnav":Ambient.autoStart();chNav(+x);break;
    case "plan":openPlan(x);break;
    case "planday":openPlanDay(x,+y);break;
    case "plandone":planDone();break;
    case "planleave":delete S.progress.plans[x];await save("progress",S.progress);syncTester();closeSheet();showTab(S.tab);toast("Plan stopped");break;
    case "med":openMed(x);break;
    case "ptopic":{const t=b.dataset.v,arr=S.pdraft.topics,i=arr.indexOf(t);i>=0?arr.splice(i,1):arr.push(t);b.setAttribute("aria-pressed",String(i<0));break}
    case "pwrite":writePrayer();break;
    case "psave-own":{const t=S.pdraft.text.trim();if(!t){toast("Write your prayer first");break}addPrayer(S.pdraft.topics.slice(0,2).join(" · ")||"My prayer",t,[]);S.pdraft={topics:[],text:""};toast("Saved to your journal");renderPray();break}
    case "psave-ai":if(S.lastPrayer){addPrayer(S.lastPrayer.title,S.lastPrayer.text,S.lastPrayer.refs);S.lastPrayer=null;S.pdraft={topics:[],text:""};Speech.stop();toast("Saved to your journal");renderPray()}break;
    case "pf":S.pfilter=x;renderPray();break;
    case "answer":{const box=$("#ans-"+x);box.innerHTML=`<div class="stack" style="margin-top:8px"><label for="tm-${x}" class="small muted">How did God answer? (optional)</label><textarea id="tm-${x}" rows="3" maxlength="800"></textarea><button class="btn" data-act="answer-save:${x}">Add to testimony wall</button></div>`;break}
    case "answer-save":{const it=S.journal.items.find(i=>i.id===x);if(it){it.answered=true;it.answeredAt=today();const tv=($("#tm-"+x)||{}).value;if(tv&&tv.trim())it.testimony=tv.trim();await save("journal",S.journal);syncTester();toast("God is faithful");renderPray()}break}
    case "pdel":{const box=$("#ans-"+x);box.innerHTML=`<div class="row" style="margin-top:6px"><span class="small">Delete this for good?</span><button class="btn soft" data-act="pdel-yes:${x}">Delete</button><button class="link" data-act="pdel-no:${x}">Keep</button></div>`;break}
    case "pdel-yes":S.journal.items=S.journal.items.filter(i=>i.id!==x);await save("journal",S.journal);syncTester();renderPray();break;
    case "pdel-no":$("#ans-"+x).innerHTML="";break;
    case "starter":sendAsk(b.dataset.v);break;
    case "send":{const v=$("#askbox").value;sendAsk(v);break}
    case "newchat":S.chat=[];save("chat",{turns:[]});renderAsk();break;
    case "ref":showRef(b);break;
    case "pf-walk":S.profile.walk=x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "pf-tr":S.profile.tr=x;S.bible.tr=x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "pf-music":S.profile.music=S.profile.music===false;b.setAttribute("aria-pressed",String(S.profile.music));break;
    case "pf-breath":S.profile.breath=+x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "pf-str":{const arr=S.profile.struggles=S.profile.struggles||[],v=b.dataset.v,i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);b.setAttribute("aria-pressed",String(i<0));break}
    case "pf-save":{const n=$("#pf-name").value.trim();if(n)S.profile.name=n;const cc=$("#pf-circle");if(cc)S.profile.circleCode=cc.value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,24);S.profile.story=$("#pf-story").value;const vsel=$("#pf-voice");if(vsel&&vsel.value)S.profile.voice=vsel.value;await save("profile",S.profile);syncTester();$("#avatarBtn").textContent=S.profile.name.charAt(0).toUpperCase();closeSheet();toast("Saved");showTab(S.tab);break}
    case "testers":openTesters();break;
    case "practice":openPractice(x);break;
    case "pr":prCollect();if(PR.id==="laydown"&&PR.i===0&&+x>0&&!(PR.d.burdens||[]).length){toast("Choose or write at least one thing first");break}PR.i=Math.max(0,Math.min(PR.steps.length-1,PR.i+(+x)));renderPr();break;
    case "pr-finish":prFinish();break;
    case "pour":openPour();break;
    case "pour-mic":POUR.listening?Pour.stop():Pour.start();break;
    case "pour-lang":POUR.lang=x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));if(POUR.listening){Pour.stop();Pour.start()}break;
    case "pour-keep":pourKeep();break;
    case "pour-release":pourRelease();break;
    case "pour-pray":pourPray();break;
    case "pour-listen":POUR.result&&Speech.speak(POUR.result.text,b);break;
    case "pour-savep":if(POUR.result){addPrayer(POUR.result.title,POUR.result.text,POUR.result.refs);Speech.stop();pourDone("Saved","Your prayer is in your journal. Come back to it whenever you need it.")}break;
    case "pr-replay":Guide.prime();prSpeak();break;
    case "bp":PR.d.pair=+x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "st":PR.d.scene=+x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "burden":{const v=b.dataset.v,a2=PR.d.burdens,i=a2.indexOf(v);if(i>=0)a2.splice(i,1);else if(a2.length<5)a2.push(v);else{toast("Up to five for now");break}b.setAttribute("aria-pressed",String(i<0));break}
    case "burden-add":{const inp=$("#burdenIn"),v=inp&&inp.value.trim();if(!v)break;if(PR.d.burdens.length>=5){toast("Up to five for now");break}PR.d.burdens.push(v);inp.value="";$("#burdenMine").insertAdjacentHTML("beforeend",`<span class="badge">${h(v)}</span>`);break}
    case "mem":PR.d.ref=b.dataset.act.slice(4);b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));break;
    case "reveal":b.outerHTML=`<span class="revealed">${h(b.dataset.w)}</span>`;break;
    case "mem-peek":$("#memPeek").innerHTML=`<div class="passage"><div class="verses">${h(PR.d.text||"")}</div></div>`;break;
    case "goals":openGoals();break;
    case "goal-add":{const inp=$("#goalIn"),v=inp&&inp.value.trim();if(!v)break;S.profile.goals=S.profile.goals||[];S.profile.goals.push({id:"g"+Date.now(),text:v,status:"praying",created:today()});await save("profile",S.profile);openGoals();break}
    case "goal-del":S.profile.goals=(S.profile.goals||[]).filter(g=>g.id!==x);await save("profile",S.profile);openGoals();break;
    case "goal-done":goalDone(x);break;
    case "covenant":openCovenant();break;
    case "covdays":S.covDays=+x;openCovenant();break;
    case "covsign":{const t=$("#covText").value.trim(),sig=$("#covSig").value.trim();if(!t||!sig){toast("Write your promise and sign your name");break}S.progress.covenant={days:S.covDays||40,start:today(),text:t,sig,signedAt:Date.now()};await save("progress",S.progress);closeSheet();toast("Covenant signed");showTab("today");break}
    case "cel-close":$("#celebrate").hidden=true;$("#celebrate").innerHTML="";if(S.tab==="today"&&$("#session").hidden)renderToday();break;
    case "cel-card":{const o=S.lastCel||{};$("#celebrate").hidden=true;openCard((o.title||"")+". "+(o.msg||""),"Selah · "+today());break}
    case "week":openWeek();break;
    case "myverses":openMyVerses();break;
    case "mv-card":{const v=S.marks.saved[+x];if(v)openCard(v.text,refLabel({b:v.b,c:v.c,v1:v.v1,v2:v.v2}));break}
    case "mv-read":{const v=S.marks.saved[+x];if(v){closeSheet();S.bible.b=v.b;S.bible.c=v.c;S.bible.focus=v.v1;showTab("bible")}break}
    case "mv-del":S.marks.saved.splice(+x,1);saveMarks();openMyVerses();break;
    case "encourage":$("#enc-"+x).innerHTML=`<div class="row" style="margin:6px 0 4px"><input type="text" id="encIn-${x}" maxlength="300" placeholder="Write a short encouragement…" style="flex:1;min-width:0"><button class="btn" data-act="encsend:${x}">Send</button></div>`;break;
    case "encsend":sendNote(x);break;
    case "note-seen":{let seen=[];try{seen=JSON.parse(localStorage.getItem("selah:seenNotes")||"[]")}catch(e){}seen.push(x);try{localStorage.setItem("selah:seenNotes",JSON.stringify(seen.slice(-200)))}catch(e){}b.closest(".note").remove();break}
    case "hl":applyHighlight(x);break;
    case "selsave":saveVerse();break;
    case "bsearch":bibleSearch(($("#bsearch")||{}).value);break;
    case "goto":S.bible.b=+x;S.bible.c=+y;S.bible.focus=+b.dataset.act.split(":")[3];Ambient.autoStart();renderBible();window.scrollTo(0,0);break;
    case "pf-german":S.profile.german=!S.profile.german;b.setAttribute("aria-pressed",String(S.profile.german));applyTextSize();if(S.profile.german){toast("Loading the German Bible…");await ensureLut()}save("profile",S.profile);break;
    case "pf-ts":S.profile.ts=+x;b.parentElement.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",String(z===b)));applyTextSize();save("profile",S.profile);break;
  }
});
document.addEventListener("visibilitychange",()=>{if(document.hidden){Pour.stop();Ambient.stop();Guide.stop();Speech.stop();Breath.stop()}});
window.addEventListener("pagehide",()=>{Ambient.stop();try{speechSynthesis.cancel()}catch(e){}});
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="bsearch"&&e.key==="Enter"){e.preventDefault();bibleSearch(e.target.value);return}if(e.target&&e.target.id==="goalIn"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-act="goal-add"]').click();return}if(e.target&&e.target.id==="askbox"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendAsk(e.target.value)}});
boot();
</script>

</body>
</html>
